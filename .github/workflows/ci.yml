name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# No job has access to model API keys: tests use random bots and the mock LLM only.
jobs:
  test:
    name: Lint and tests
    runs-on: ubuntu-latest
    services:
      # Same address and throwaway password as the Compose default, so the
      # database tests run unchanged. With CI set they fail instead of skipping.
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_DB: arena
          POSTGRES_PASSWORD: arena_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready --username=arena --dbname=arena"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  compose:
    name: Compose stack is healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack and wait for every healthcheck
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Reach the API and the web UI from the host
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8100/health
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3100/
      - name: Show logs
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  web:
    name: Web UI lint, build and Playwright
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - name: Start the stack and wait for every healthcheck
        working-directory: .
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Fill the fresh CI database with DEMO ratings (random bots only)
        working-directory: .
        run: docker compose exec -T arena python -m arena.ratings.demo_seed --matches 30
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke tests on port 3100 (375 and 1280 px)
        run: npx playwright test
      - name: Keep the Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7
      - name: Show logs
        if: failure()
        working-directory: .
        run: docker compose logs
      - name: Stop the stack
        if: always()
        working-directory: .
        run: docker compose down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan the full history with gitleaks
        run: >
          docker run --rm --volume "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --no-banner
