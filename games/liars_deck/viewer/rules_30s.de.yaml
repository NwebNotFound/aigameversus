title: Liar's Deck in 30 Sekunden
lines:
  - "Liar's Deck ist ein Bluff-Kartenspiel für 2 bis 4 Spieler. Ziel: als Letzter übrig bleiben."
  - "In jeder Runde bekommt jeder 5 Karten, und eine Kartensorte wird zur Tischkarte bestimmt: König, Dame oder Ass."
  - "Wer an der Reihe ist, legt 1 bis 3 Karten verdeckt ab und behauptet, es seien alles Tischkarten. Lügen ist erlaubt."
  - "Oder er ruft 'Lügner!' und zweifelt die Karten des Vorgängers an. Diese Karten werden aufgedeckt."
  - "Ist eine davon keine Tischkarte (Joker zählen als Tischkarte), muss der Lügner abdrücken. Waren alle echt, muss der Rufer abdrücken."
  - "Jeder hat einen Revolver mit 6 Kammern und einer scharfen Patrone an geheimer Stelle. Jeder Schuss dreht eine Kammer weiter, das Risiko steigt also: 1 zu 6, dann 1 zu 5 und so weiter."
  - "Ein scharfer Schuss scheidet den Spieler aus. Danach beginnt eine neue Runde mit neuen Karten und neuer Tischkarte."
  - "Variante Teufelskarte: Deckt ein Ruf die Teufelskarte auf, drücken alle außer dem, der sie gelegt hat, gleichzeitig ab."
  - "Achte darauf, wer viel blufft, wer oft zweifelt und wessen Revolver bald losgeht."
