title: Throne of Tokens in 30 seconds
lines:
  - "Four to six nations share a hex map. Each starts with one city, a spearman and a settler, and sees only the land around its own cities and armies."
  - "Every round all nations give their orders at the same time, in one call each: build, train units, move armies, talk and make treaties."
  - "Cities produce food, wood, iron and gold for one shared stock. Food makes cities grow, and bigger cities have room for more buildings."
  - "Armies move once a round. Moving onto a tile held by a nation you are at war with is an attack; an undefended city that is beaten changes hands."
  - "Treaties (peace, alliance, tribute, open borders) can be broken, but everyone sees it and the breaker loses reputation."
  - "Barbarians and rebel cities belong to no nation and fight everyone."
  - "A nation wins by holding half of all cities (once there are two per nation), by keeping 500 gold for five rounds in a row, or by the best score after round 60."
  - "Watch who builds an army near whom, who talks peace while marching, and who is close to the gold countdown."
