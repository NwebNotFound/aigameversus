title: Throne of Tokens in 30 Sekunden
lines:
  - "Vier bis sechs Nationen teilen sich eine Karte aus Sechsecken. Jede beginnt mit einer Stadt, einem Speerträger und einem Siedler und sieht nur das Land rund um ihre Städte und Armeen."
  - "In jeder Runde geben alle Nationen gleichzeitig ihre Befehle, mit einem Aufruf je Nation: bauen, Einheiten ausbilden, Armeen ziehen, verhandeln, Verträge schließen."
  - "Städte erzeugen Nahrung, Holz, Eisen und Gold für einen gemeinsamen Vorrat. Nahrung lässt Städte wachsen, und größere Städte haben Platz für mehr Gebäude."
  - "Armeen ziehen einmal pro Runde. Wer auf ein Feld einer Nation zieht, mit der er im Krieg ist, greift an; eine geschlagene, unverteidigte Stadt wechselt den Besitzer."
  - "Verträge (Frieden, Bündnis, Tribut, offene Grenzen) lassen sich brechen, aber alle sehen es, und der Vertragsbrecher verliert Ansehen."
  - "Barbaren und aufständische Städte gehören keiner Nation und kämpfen gegen alle."
  - "Eine Nation gewinnt, wenn sie die Hälfte aller Städte hält (sobald es zwei je Nation gibt), fünf Runden in Folge 500 Gold besitzt oder nach Runde 60 die meisten Punkte hat."
  - "Achte darauf, wer Truppen an wessen Grenze sammelt, wer von Frieden spricht und dabei marschiert, und wer dem Gold-Countdown nahe ist."
