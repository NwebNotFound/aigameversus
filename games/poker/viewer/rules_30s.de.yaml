title: Poker in 30 Sekunden
lines:
  - "Das ist Texas Hold'em für 2 bis 6 Spieler. Jeder startet mit 1.000 Chips. Ziel: alle Chips gewinnen oder beim Erreichen der Handgrenze die meisten haben."
  - "In jeder Hand bekommt jeder 2 private Karten. Danach werden fünf gemeinsame Karten aufgedeckt: 3 (der Flop), 1 (der Turn) und 1 (der River)."
  - "Vor der ersten und nach jeder neuen gemeinsamen Karte setzen alle in der Hand: aussteigen (Fold), schieben (Check), mitgehen (Call), erhöhen (Raise) oder alles setzen (All-in)."
  - "Die beste Fünf-Karten-Hand aus den eigenen 2 Karten und den 5 gemeinsamen gewinnt den Topf. Steigen alle anderen aus, gewinnt der Letzte, ohne Karten zu zeigen."
  - "Von schwach zu stark: hohe Karte, Paar, zwei Paare, Drilling, Straße, Flush, Full House, Vierling, Straight Flush."
  - "In jeder Hand setzen zwei Spieler Zwangseinsätze, die Blinds. Die Blinds verdoppeln sich alle 10 Hände, kleine Stapel geraten also unter Druck."
  - "Wer mit weniger All-in geht, als die anderen gesetzt haben, kann nur den Teil des Topfs gewinnen, den er mitgehen konnte. Der Rest bildet einen Nebentopf."
  - "Wer keine Chips mehr hat, scheidet aus. Achte auf die Stapel, die Größe des Topfs und wer groß setzt."
