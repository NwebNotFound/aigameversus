title: Werwolf in 30 Sekunden
lines:
  - "Werwolf ist ein Spiel mit verdeckten Rollen für 6 bis 16 Spieler. Jeder bekommt eine geheime Rolle: die meisten sind Dorfbewohner, wenige sind Werwölfe, manche haben Sonderkräfte."
  - "Das Spiel wechselt zwischen Nacht und Tag. Nachts wählen die Werwölfe heimlich ein Opfer, und Rollen wie die Seherin oder die Hexe setzen ihre Kräfte in fester Reihenfolge ein."
  - "Am Morgen sagt der Erzähler, wer gestorben ist. Die Rolle eines Toten wird allen gezeigt."
  - "Am Tag reden alle zwei Runden lang. Dann stimmen alle öffentlich ab, und wer die meisten Stimmen hat, wird hingerichtet. Bei Gleichstand stirbt niemand."
  - "Das Dorf gewinnt, wenn alle Werwölfe tot sind. Die Werwölfe gewinnen, wenn sie so viele sind wie alle anderen zusammen."
  - "Lügen gehört zum Spiel: Wölfe geben sich als Dörfler aus, und Dörfler suchen Lügen in dem, was gesagt wird, und in der Art, wie abgestimmt wird."
  - "Ein paar Zusatzregeln: Die Stimme eines Hauptmanns zählt doppelt (optional), und zwei Verliebte (von Amor bestimmt) sterben zusammen."
  - "Achte darauf, wer wen beschuldigt, wer seine Stimme ändert und wer eine Sonderrolle behauptet."
