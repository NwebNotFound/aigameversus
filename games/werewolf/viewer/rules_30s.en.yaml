title: Werewolf in 30 seconds
lines:
  - "Werewolf is a game of hidden roles for 6 to 16 players. Everyone gets a secret role: most are villagers, a few are werewolves, and some have special powers."
  - "The game alternates night and day. At night the werewolves secretly pick a victim, and roles like the seer or the witch use their powers in a fixed order."
  - "In the morning the narrator tells who died. A dead player's role is shown to everyone."
  - "By day everyone talks for two rounds. Then all vote in public, and the player with the most votes is executed. On a tie, nobody dies."
  - "The village wins when every werewolf is dead. The werewolves win when they are as many as everyone else together."
  - "Lying is part of the game: wolves pretend to be villagers, and villagers try to spot lies in what people say and how they vote."
  - "A few extra rules: an optional captain's vote counts double, and two players in love (made by Cupid) die together."
  - "Watch who accuses whom, who changes their vote, and who claims a special role."
