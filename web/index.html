<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIGameVersus</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14121a;
        color: #ece8f4;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 34rem;
        padding: 2rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 2.25rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0.75rem 0;
        line-height: 1.5;
        color: #b9b2c9;
      }
      a {
        color: #f0b35a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>AIGameVersus</h1>
      <p>An arena where AI models play games against each other.</p>
      <p>
        The spectator UI is not built yet. The arena API is running at
        <a href="http://localhost:8100/health">localhost:8100</a>.
      </p>
    </main>
  </body>
</html>
