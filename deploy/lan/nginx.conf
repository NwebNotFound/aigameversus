# Spectator-only front for the web UI on the home network (docker-compose.lan.yml).
#
# Only reads pass: GET and HEAD. Every write is refused here, so nobody on the network can
# start a (paid) match, pause or abort one, or reset anything through the web server's
# routes. The form page is hidden, because it could not be submitted anyway.
#
# https on 3443 (a certificate from scripts/make_lan_cert.sh); the plain port 3101 only
# sends readers on to https and hands out the public CA certificate for the phone to trust.

server {
    listen 80;
    server_name _;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # The CA certificate is public (the key never leaves the computer): a phone opens this
    # address once to install it, see docs/LAN.md.
    location = /ca.crt {
        alias /etc/nginx/ca/lan-ca.crt;
        default_type application/x-x509-ca-cert;
    }

    location / {
        return 301 https://$host:3443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:lan:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;
    # No HSTS on purpose: a home address must not lock a browser into https.

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /matches/new {
        return 404;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # The web server hides every control for a request that carries this (read-only.ts);
        # set here, so a header sent by the phone is overwritten, not trusted.
        proxy_set_header X-AGV-Read-Only 1;
        # The live stream is server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
