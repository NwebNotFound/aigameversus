# Spectator-only front for the web UI on the home network (docker-compose.lan.yml).
#
# Only reads pass: GET and HEAD. Every write is refused here, so nobody on the network can
# start a (paid) match, pause or abort one, or reset anything through the web server's
# routes. The form page is hidden, because it could not be submitted anyway.
server {
    listen 80;
    server_name _;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /matches/new {
        return 404;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        # The live stream is server-sent events: no buffering, long reads.
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
