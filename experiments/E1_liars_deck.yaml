# Experiment 1: who plays Liar's Deck well, does thinking longer help, and do
# stronger models beat cheap ones?
#
# This file is the pre-registration. It is written before the first paid match.
# Once `status` is `approved` it changes only through an entry under
# `amendments`, with a higher `version`, a date and a reason.
# Checked by arena/research/experiment.py; the matches it fixes are in
# E1_liars_deck_schedule.csv (tests/research/test_experiment.py keeps both in step).

id: E1
title: "Liar's Deck: a league of cheap models, reasoning effort, and stronger guests"
version: 3
status: approved          # approved by Nils 2026-11-11 (stage B, C after A); -> running -> closed
registered: "2026-11-11"
author: Arena Researcher
amendments:
  - version: 2
    date: "2026-11-11"
    what: >
      Stage A ends after its pilot (budget lowered to the 0.30 EUR of the
      pilot). New stage A2 replaces its league: the six models that passed the
      pilot rule, at all 15 tables of four, 4 seatings x 2 seeds = 120
      matches, run budget 3.00 EUR. H1 to H4 now test stage A2, Holm over 6.
      Stage B's substitutes lose qwen-flash and gemini-flash-lite. Matches are
      played with "memory": false and prompt_version liars_deck-p1.
    why: >
      The pilot (6 of 8 matches, 0.2314 EUR, stopped by the budget rule)
      found two models over the 10 % fallback limit: qwen-flash 52 % (its
      reasoning ran into the 1 500-token output limit, then the turns timed
      out) and gemini-flash-lite 19 % (the provider's rate limit ended its
      agent in one match). The plan's rule is to fix or drop them; the owner
      chose to drop them now and fix them in a later stage. The pilot also
      showed a league match of 8 models would cost about 0.033 EUR, so the
      approved 3.00 EUR could not pay for the 112 planned matches; 6 models
      cost about 0.020 EUR a match. Decided before any league match was played.
    pilot_data: "the 6 pilot matches stay pilot data and are not part of any test"
  - version: 3
    date: "2026-11-11"
    what: >
      A clarification, no change to how matches are played. All stages run
      without answer repair: a malformed tool call is rejected and corrected
      as before (the arena is getting an optional repair of such calls).
      Reliability is reported in four parts per model: clean moves,
      repaired moves (zero here), rejected answers and fallback moves.
    why: >
      Repair changes what counts as a rejected answer and a fallback move.
      Mixing repaired and unrepaired matches inside a stage would confound
      the reliability results and stage B. Written while league A2 was
      running, before any outcome was read.
# Every paid run needs the project owner's own yes. What he has said yes to:
approvals:
  - stages: [A]
    date: "2026-11-11"
    by: "project owner, passed on by Arena Lead"
    scope: "8 pilot matches up to 0.30 EUR, then the league of 112 matches with a run budget of 3.00 EUR, stopped at 90 %"
  - stages: [A2]
    date: "2026-11-11"
    by: "project owner, passed on by Arena Lead (his words: \"A jetzt, B später\")"
    scope: >
      The league of the six clean models, 120 matches, run budget 3.00 EUR,
      stopped at 90 %, one match at a time through the arena API, after the
      stack is rebuilt. Fixing qwen-flash and gemini-flash-lite for a league
      of eight is a later stage and needs a new yes on its budget.
  - stages: [B, C]
    date: "2026-11-11"
    by: "project owner, passed on by Arena Lead"
    scope: >
      After stage A ran clean (every model below 10 % fallback turns, no cap
      reached), one stage after the other: B with 4.50 EUR, C with 7.50 EUR,
      each stopped at 90 % of its budget, one match at a time through the
      arena API. The match cap stays 0.50 EUR: the plan expects about 0.05
      (B) and 0.08 EUR (C) per match and asks for no higher cap. The four
      guest models start only after Arena Builder has checked their ids,
      tool support and prices.

question: >
  Three questions, one game. A: do the eight cheap roster models differ in
  playing strength and in bluffing skill? B: does the same model play better
  when it is allowed to think longer? C: do four stronger models beat cheap
  ones under equal conditions?

game: liars_deck
settings: {variant: base}

conditions:
  seats: 4
  seat_names: "p1 to p4; no prompt names a model, so players do not know who sits where"
  memory: "off: every match is started with \"memory\": false (nothing read, nothing written)"
  personalities: none
  language: "English rules text; the game has no language setting"
  prompt_version: >
    liars_deck-p1 for all three stages, passed explicitly as the setting
    prompt_version once the arena has it, so a change of the default can never
    fall inside a stage, and read back from match_started in every log. p2 is
    compared in a separate plan (research/README.md).
    The commit of main is stored with every match; a stage is never split
    across commits.
  history_shown: "last 40 visible events (HISTORY_LIMIT)"
  sampling: "provider defaults; the arena sets no temperature"
  answer_repair: "off in every stage (version 3): malformed tool calls are rejected and corrected, never repaired"
  tool_choice: required
  provider_routing: "OpenRouter's default; the serving provider is stored per call if the export has it"
  usd_to_eur: "1.0 as in config/models.yaml (overstates cost)"
  how_matches_run: >
    Through the API of the shared stack (POST /matches with model seats), one
    match at a time, so that each can be watched live and one ledger counts
    every call.
  needs_before_start:
    stage_A: "model seats and a run budget in POST /matches; the prompt fix that tells a player its own seat; the shared stack rebuilt from that main"
    stage_B: "reasoning effort and output limit per seat; one model in several seats"
    stage_C: "the four strong models in config/models.yaml"
    all: "per call in the export: tokens in and out, duration, outcome"

# Ids and prices as listed by openrouter.ai/api/v1/models on 2026-11-11 (USD per
# million tokens). All twelve support tools and tool_choice there.
models:
  deepseek-flash:    {openrouter: deepseek/deepseek-v4.1-flash,    input_usd_per_mtok: 0.051,  output_usd_per_mtok: 0.567,  tier: cheap}
  qwen-flash:        {openrouter: qwen/qwen3.8-flash,              input_usd_per_mtok: 0.15,   output_usd_per_mtok: 0.47,   tier: cheap}
  glm-flash:         {openrouter: z-ai/glm-5.3-flash,              input_usd_per_mtok: 0.0399, output_usd_per_mtok: 0.0784, tier: cheap}
  gpt-luna:          {openrouter: openai/gpt-6-luna,               input_usd_per_mtok: 0.10,   output_usd_per_mtok: 0.50,   tier: cheap}
  claude-haiku:      {openrouter: anthropic/claude-haiku-5.5,      input_usd_per_mtok: 0.10,   output_usd_per_mtok: 0.50,   tier: cheap}
  mistral-small:     {openrouter: mistralai/mistral-small-2603,    input_usd_per_mtok: 0.15,   output_usd_per_mtok: 0.60,   tier: cheap}
  llama-scout:       {openrouter: meta-llama/llama-4-scout,        input_usd_per_mtok: 0.10,   output_usd_per_mtok: 0.30,   tier: cheap}
  gemini-flash-lite: {openrouter: google/gemini-2.5-flash-lite,    input_usd_per_mtok: 0.10,   output_usd_per_mtok: 0.40,   tier: cheap}
  gpt-terra:         {openrouter: openai/gpt-6.1-terra,            input_usd_per_mtok: 1.00,   output_usd_per_mtok: 5.00,   tier: strong}
  claude-sonnet:     {openrouter: anthropic/claude-sonnet-5.5,     input_usd_per_mtok: 2.00,   output_usd_per_mtok: 10.00,  tier: strong}
  gemini-flash:      {openrouter: google/gemini-3.8-flash,         input_usd_per_mtok: 0.825,  output_usd_per_mtok: 4.125,  tier: strong}
