# The words of the Werewolf chronicle in English: four styles that differ in structure
# (how chapters are titled and laid out) and in wording. Every kind has several variants; the
# composer picks one by the match seed and never uses the same finished sentence twice.
# Fields: see `FIELDS` in arena/chronicle/compose.py; the tests format every variant.
epic:
  title: "The Chronicle of the Werewolf Village"
  layout: {joiner: " ", prefix: "", paragraph: 0}
  chapters:
    prologue: "Prologue: The Gathering"
    night: "The {Nth} Night"
    day: "The {Nth} Day"
    epilogue: "Epilogue: What Remained"
  glance_title: "At a glance"
  glance_labels:
    winner: "Victor"
    length: "Duration"
    turning_point: "The turning point"
    accurate_voter: "Keenest eye"
    deceptive: "Master of masks"
    cost: "Cost of the tale"
  glance_values:
    length: "{days} days"
    accurate_voter: "{who}, right in {right} of {of} votes"
    deceptive: "{who}, {deceptive_note}"
    cost: "{cost}"
  turning_points:
    wrong_execution: "Day {n}: the village sent {player} ({role}) to the gallows, and the wrong one fell"
    wolf_executed: "Day {n}: the village found a wolf in {player}"
    seer_killed: "Night {n}: the wolves silenced {player}, the Seer"
    lover_grief: "Night {n}: {player} died of grief for a lost love"
    hunter_shot: "{hunter} fired a last shot and took {target} along"
    false_claim: "{who} claimed a role that was not theirs"
    save: "Night {n}: a life was saved in the dark ({target})"
  deceptive_notes:
    survived: "unmasked by nobody, alive at the end after {days} days"
    fell: "kept the mask until day {days}"
    lies: " and lying about their role {lies} time(s)"
  kinds:
    cast:
      - "The village gathered, {count} souls beneath one roof: {cast}."
      - "{count} players took their seats, and fate dealt each a secret: {cast}."
    lovers:
      - "Cupid's arrow found {a} and {b}, and from that hour their lives were bound as one."
    night_falls:
      - "Night {n} settled over the rooftops, and {alive} souls closed their eyes."
      - "The {nth} night came down cold and silent upon {alive} sleepers."
      - "Darkness returned for the {nth} time; {alive} still lived to fear it."
    wolf_plan:
      - "In the dark, {who} whispered to the pack: \"{quote}\""
      - "Teeth gleamed as {who} murmured, \"{quote}\""
    wolf_target:
      - "The pack chose {target}."
    wolf_missed_witch:
      - "The wolves came for {target}, but the Witch's potion pulled them back from the brink."
    wolf_missed_protector:
      - "The wolves came for {target}, but a hidden guardian stood in the way."
    wolf_missed_unknown:
      - "The wolves came for {target}, and somehow {target} lived to see morning."
    seer_found_wolf:
      - "{seer} turned the Seer's gaze on {target} and saw a wolf behind the face."
    seer_found_village:
      - "{seer} peered into {target} and found only a {role}, honest as bread."
      - "The Seer {seer} looked at {target}: a {role}, nothing more."
    witch_heal:
      - "{witch} tipped the healing draught to {target}'s lips."
    witch_poison:
      - "{witch} measured out the poison, and {target} was marked for death."
    night_quiet:
      - "And yet the night passed, and no one fell."
      - "Dawn found every bed occupied."
      - "The dark gave back every sleeper: nobody was missing."
    death_wolves:
      - "At first light {player} the {role} was found torn apart by the wolves."
      - "The village woke to a cry: {player}, the {role}, lay dead, {cause}."
      - "{player} ({role}) did not wake; the wolves had been there."
    death_poison:
      - "{player}, the {role}, lay dead of poison."
    death_grief:
      - "{player} ({role}) could not bear the loss and followed their love into death."
    death_other:
      - "{player}, the {role}, was dead: {cause}."
    hunter_shot:
      - "With a last breath {hunter} the Hunter raised the gun and took {target} down too."
    day_breaks:
      - "The {nth} day dawned on {alive} survivors, and the arguing began."
      - "Day {n}: {alive} of them gathered in the square, eyes searching faces."
      - "Day {n}: the square filled with {alive} wary faces."
    captain:
      - "The village chose {player} as captain with {votes} votes, a voice that would count double."
    vote_reason:
      - "{who} named {target}: \"{quote}\""
      - "\"{quote_bare},\" said {who}, and cast the vote against {target}."
      - "Against {target}, {who} offered this reason: \"{quote}\""
    speech_own:
      - "{who} spoke up: \"{quote}\""
    speech_accuser:
      - "{who} turned on {focus}: \"{quote}\""
    tally_decided:
      - "The count was read: {tally}. {executed} stood condemned."
    tally_none:
      - "The count was read: {tally}, and no one carried the day."
    execution_wrong:
      - "{player}, an honest {role}, was dragged to the gallows with {votes} voices against, and the wolves smiled."
      - "{votes} hands rose against {player}, who was no wolf at all but a {role}."
    execution_wolf:
      - "{votes} voices sent {player} to the gallows, and a wolf fell at last."
    execution_other:
      - "{player}, the {role}, was condemned by {votes} votes."
    no_execution:
      - "The village could not agree, and the gallows stayed empty."
      - "The vote split like dry wood, and nobody was led away."
      - "Voices clashed and cancelled out; the gallows waited in vain."
    claim_lie:
      - "{who} swore to be {claimed_a}, but was in truth {actual_a}."
    claim_true:
      - "{who} declared the role of {role}, and it was no lie."
    counterclaim:
      - "{claimants} all claimed to be the {role}, and not all of them could be telling the truth."
    result_wolves:
      - "The wolves ({winners}) now outnumbered the village, and the night was theirs for good after {days} days."
    result_village:
      - "The last wolf fell, and the village ({winners}) had won after {days} days."
    result_lovers:
      - "Only the lovers ({winners}) were left, and love had outlasted everyone."
    result_white_wolf:
      - "The White Werewolf ({winners}) stood alone among the dead."
    result_nobody:
      - "The days ran out and neither side had won."
    reveal:
      - "Behind the masks: {reveal}."
