# The words of the Liar's Deck chronicle in English: four styles that differ in structure and in
# wording. Fields: see `FIELDS` in arena/chronicle/tell_liars_deck.py (the tests format every variant).
# `again` prefixes a sentence that every variant of its kind has already used in this chronicle.
epic:
  title: "The Saga of Liar's Deck"
  layout: {joiner: " ", prefix: "", paragraph: 0}
  again: ["Once more:", "Yet again:", "And still:", "Again:", "As before:", "One more time:"]
  chapters:
    prologue: "Prologue: The Table Is Set"
    round: "The Round of the {Nth} Trial"
    epilogue: "Epilogue: The Last at the Table"
  glance_title: "At a glance"
  glance_labels:
    winner: "Last one standing"
    length: "Duration"
    turning_point: "The turning point"
    bluffer: "Boldest bluffer"
    caller: "Sharpest caller"
    survivor: "Luckiest soul"
    cost: "Cost of the saga"
  glance_values:
    length: "{rounds} rounds"
    bluffer: "{who}, lying in {lies} of {plays} plays"
    caller: "{who}, right on {right} of {of} calls"
    survivor: "{who}, who lived through {shots} pulls of the trigger"
    cost: "{cost}"
  turning_points:
    coin_flip: "Round {n}: {player} faced a coin flip with the revolver and lived"
    devil: "Round {n}: the devil card came to light and the whole table paid"
    big_lie_caught: "Round {n}: {target} was caught lying with {count} false cards"
    final_duel: "Round {n}: {winner} outlasted {loser} in the final duel"
    final_shot: "Round {n}: the last shot fell on {loser}, and {winner} stood alone"
    wrong_call_fatal: "Round {n}: {caller} called an honest hand of {target} and paid with their life"
  kinds:
    cast:
      - "{count} players sat down at the table, each with a revolver and a lie in reserve: {cast}."
    cast_devil:
      - "{count} players sat down, and among the cards lay the devil card: {cast}."
    round_starts:
      - "The {nth} round began beneath the banner of the {card}, with {alive} still at the table, and {starter} opened."
      - "Round {n}: the table card was the {card}, {alive} players remained, and {starter} led."
      - "The cards were dealt anew, and the {card} ruled the {nth} round; {starter} spoke first."
      - "The {nth} round: the {card} held sway, {alive} remained, and {starter} began the talking."
      - "Once more the cards were shuffled, the {card} was named, and {starter} stepped forward."
    duel:
      - "Only {a} and {b} remained, and the room held its breath."
      - "It was a duel now, {a} against {b}, and nobody else was left to hide behind."
      - "Alone at the table, {a} and {b} measured each other once more."
    lie_big:
      - "{who} laid {count} cards face down and called them {card_pl}, though {false_cards} of them were nothing of the kind."
      - "{who} pushed {count} cards forward and swore they were all {card_pl}; {false_cards} were lies."
    truth_big:
      - "{who} laid {count} cards down, and every one of them really was a {card}."
      - "{who} played {count} {card_pl} and told the truth, which was the boldest bluff of all."
    claim_quote:
      - "{who} said: \"{quote}\""
      - "\"{quote}\" said {who}."
      - "{who} spoke, calm as a lake: \"{quote}\""
      - "{who} offered the table this: \"{quote}\""
    call:
      - "{caller} rose and called {target} a liar!"
      - "\"Liar!\" cried {caller}, pointing at {target}."
      - "{caller} did not believe {target}, and said so."
      - "{caller} narrowed their eyes at {target}: liar."
    call_auto:
      - "{caller} had no choice but to call {target} a liar."
    reveal_caught:
      - "The cards turned over: {cards}. No {card} in the lot, and {n_false} of them lies. {target} was caught."
      - "{target}'s hand lay open: {cards}. The claim of {card_pl} collapsed, and {caller} had been right."
    reveal_wrong:
      - "The cards turned over: {cards}. All true to the {card}. {caller} had accused an honest hand."
      - "{target} showed {cards}, and it was all honest. {caller} had called wrongly."
      - "The truth lay on the table: {cards}. {caller} had doubted the wrong player."
      - "{target}'s cards said {cards}: honest to the last. {caller} had misjudged."
    devil_revealed:
      - "The cards turned over: {cards}, and among them the devil card! The table would pay for {caller}'s call."
    trigger_click:
      - "{player} pulled the trigger, pull {pull}, odds {odds}. Click. The chamber was empty."
      - "{player} put the barrel to the temple, pull {pull}, and heard only a click."
      - "Pull {pull} for {player}, at {odds}, and only silence answered."
    trigger_close:
      - "{player} pulled, pull {pull}, odds {odds}, and the chamber was empty. A narrow escape."
      - "A {odds} chance of death, and {player} lived: pull {pull}, and the cylinder turned on."
    trigger_bang:
      - "{player} pulled the trigger, and the thunderclap said it all. {player} was gone."
      - "Pull {pull} was the live one for {player}, and the table fell silent."
    eliminated:
      - "{player} left the table in {place} place."
      - "So {player} finished {place}, and the chair stayed empty."
    result:
      - "{winner} alone remained after {rounds} rounds, the last one breathing."
    ranking:
      - "The final order: {ranking}."
