# The words of the Throne of Tokens chronicle in English: four styles that differ in structure and
# in wording. Fields: see `FIELDS` in arena/chronicle/tell_civ.py (the tests format every variant).
# `again` prefixes a sentence that every variant of its kind has already used in this chronicle.
