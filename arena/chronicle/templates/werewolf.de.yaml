# Die Worte der Werwolf-Chronik auf Deutsch: vier Stile, die sich im Aufbau (Kapitelüberschriften,
# Anordnung) und in den Worten unterscheiden. Zu jeder Art gibt es mehrere Varianten; der Komponist
# wählt eine nach dem Seed des Spiels und benutzt denselben fertigen Satz nie zweimal.
# Felder: siehe `FIELDS` in arena/chronicle/compose.py.
epic:
  title: "Die Chronik des Werwolfdorfes"
  layout: {joiner: " ", prefix: "", paragraph: 0}
  chapters:
    prologue: "Prolog: Die Versammlung"
    night: "Die {nth} Nacht"
    day: "Der {nth} Tag"
    epilogue: "Epilog: Was blieb"
  glance_title: "Auf einen Blick"
  glance_labels:
    winner: "Sieger"
    length: "Dauer"
    turning_point: "Der Wendepunkt"
    accurate_voter: "Schärfstes Auge"
    deceptive: "Meister der Masken"
    cost: "Preis der Geschichte"
  glance_values:
    length: "{days} Tage"
    accurate_voter: "{who}, richtig in {right} von {of} Abstimmungen"
    deceptive: "{who}, {deceptive_note}"
    cost: "{cost}"
  turning_points:
    wrong_execution: "Tag {n}: Das Dorf schickte {player} ({role}) an den Galgen, und es traf den Falschen"
    wolf_executed: "Tag {n}: Das Dorf fand in {player} einen Wolf"
    seer_killed: "Nacht {n}: Die Wölfe brachten {player}, die Seherin, zum Schweigen"
    lover_grief: "Nacht {n}: {player} starb vor Gram um die verlorene Liebe"
    hunter_shot: "{hunter} feuerte einen letzten Schuss und nahm {target} mit"
    false_claim: "{who} gab eine Rolle vor, die nicht die eigene war"
    save: "Nacht {n}: Im Dunkeln wurde ein Leben gerettet ({target})"
  deceptive_notes:
    survived: "von niemandem entlarvt, nach {days} Tagen noch am Leben"
    fell: "trug die Maske bis Tag {days}"
    lies: " und log {lies}-mal über die eigene Rolle"
  kinds:
    cast:
      - "Das Dorf versammelte sich, {count} Seelen unter einem Dach: {cast}."
      - "{count} Spieler nahmen Platz, und das Schicksal gab jedem ein Geheimnis: {cast}."
    lovers:
      - "Amors Pfeil traf {a} und {b}, und von dieser Stunde an waren ihre Leben eins."
    night_falls:
      - "Nacht {n} legte sich über die Dächer, und {alive} Seelen schlossen die Augen."
      - "Die {nth} Nacht kam kalt und still über {alive} Schlafende."
      - "Zum {nth}n Mal kehrte die Dunkelheit zurück; {alive} lebten noch, um sie zu fürchten."
    wolf_plan:
      - "Im Dunkeln flüsterte {who} dem Rudel zu: \"{quote}\""
      - "Zähne blitzten, als {who} murmelte: \"{quote}\""
    wolf_target:
      - "Das Rudel wählte {target}."
    wolf_missed_witch:
      - "Die Wölfe kamen für {target}, doch der Trank der Hexe holte das Opfer vom Abgrund zurück."
    wolf_missed_protector:
      - "Die Wölfe kamen für {target}, doch ein verborgener Wächter stand im Weg."
    wolf_missed_unknown:
      - "Die Wölfe kamen für {target}, und irgendwie erlebte {target} den Morgen."
    seer_found_wolf:
      - "{seer} richtete den Blick der Seherin auf {target} und sah hinter dem Gesicht einen Wolf."
    seer_found_village:
      - "{seer} sah in {target} nur {role_acc}, ehrlich wie Brot."
      - "Die Seherin {seer} blickte auf {target}: {role_a}, nicht mehr."
    witch_heal:
      - "{witch} setzte {target} den Heiltrank an die Lippen."
    witch_poison:
      - "{witch} maß das Gift ab, und {target} war zum Tode gezeichnet."
    night_quiet:
      - "Und doch verging die Nacht, und niemand fiel."
      - "Der Morgen fand jedes Bett besetzt."
      - "Das Dunkel gab jeden Schläfer zurück: Niemand fehlte."
    death_wolves:
      - "Bei Tagesanbruch fand man {player}, {role_the}, von den Wölfen zerrissen."
      - "Das Dorf erwachte von einem Schrei: {player} ({role}) lag tot da, {cause}."
      - "{player} ({role}) erwachte nicht mehr; die Wölfe waren da gewesen."
    death_poison:
      - "{player} ({role}) lag tot da, vergiftet."
    death_grief:
      - "{player} ({role}) ertrug den Verlust nicht und folgte der Liebe in den Tod."
    death_other:
      - "{player} ({role}) war tot: {cause}."
    hunter_shot:
      - "Mit dem letzten Atemzug hob {hunter} der Jäger das Gewehr und riss {target} mit sich."
    day_breaks:
      - "Der {nth} Tag dämmerte über {alive} Überlebenden, und das Streiten begann."
      - "Tag {n}: {alive} von ihnen versammelten sich auf dem Platz und suchten in den Gesichtern."
      - "Tag {n}: Der Platz füllte sich mit {alive} misstrauischen Gesichtern."
    captain:
      - "Das Dorf wählte {player} mit {votes} Stimmen zum Hauptmann, eine Stimme, die doppelt zählte."
    vote_reason:
      - "{who} nannte {target}: \"{quote}\""
      - "\"{quote_bare}\", sagte {who} und stimmte gegen {target}."
      - "Gegen {target} führte {who} diesen Grund an: \"{quote}\""
    speech_own:
      - "{who} ergriff das Wort: \"{quote}\""
    speech_accuser:
      - "{who} wandte sich gegen {focus}: \"{quote}\""
    tally_decided:
      - "Die Stimmen wurden gezählt: {tally}. {executed} war verurteilt."
    tally_none:
      - "Die Stimmen wurden gezählt: {tally}, und niemand setzte sich durch."
    execution_wrong:
      - "{player}, {role_a}, wurde mit {votes} Stimmen zum Galgen geführt, doch kein Wolf, und die Wölfe lächelten."
      - "{votes} Hände hoben sich gegen {player}, der gar kein Wolf war, sondern {role_a}."
    execution_wolf:
      - "{votes} Stimmen schickten {player} an den Galgen, und endlich fiel ein Wolf."
    execution_other:
      - "{player} ({role}) wurde mit {votes} Stimmen verurteilt."
    no_execution:
      - "Das Dorf konnte sich nicht einigen, und der Galgen blieb leer."
      - "Die Abstimmung zerbrach wie trockenes Holz, und niemand wurde abgeführt."
      - "Stimmen prallten aufeinander und hoben sich auf; der Galgen wartete vergebens."
    claim_lie:
      - "{who} schwor, {claimed_a} zu sein, war aber in Wahrheit {actual_a}."
    claim_true:
      - "{who} erklärte, {role_the} zu sein, und das war keine Lüge."
    counterclaim:
      - "{claimants} behaupteten alle, {role_the} zu sein, und nicht alle konnten die Wahrheit sagen."
    result_wolves:
      - "Die Wölfe ({winners}) waren dem Dorf nun überlegen, und die Nacht gehörte ihnen nach {days} Tagen für immer."
    result_village:
      - "Der letzte Wolf fiel, und das Dorf ({winners}) hatte nach {days} Tagen gewonnen."
    result_lovers:
      - "Nur das Liebespaar ({winners}) war übrig, und die Liebe hatte alle überdauert."
    result_white_wolf:
      - "Der Weiße Werwolf ({winners}) stand allein unter den Toten."
    result_nobody:
      - "Die Tage liefen ab, und keine Seite hatte gewonnen."
    reveal:
      - "Hinter den Masken: {reveal}."
