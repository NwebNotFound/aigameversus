      - "{caller} nennt {target} einen Lügner."
      - "{caller} fordert {target} heraus."
      - "{caller} zweifelt {target} an."
      - "{caller} sagt, {target} lüge."
    call_auto:
      - "{caller} muss {target} einen Lügner nennen."
    reveal_caught:
      - "Aufdeckung: {cards}. {target} hat gelogen ({n_false} falsch); {caller} hatte recht."
      - "{target} erwischt: {cards}, die Behauptung {card} hält nicht."
    reveal_wrong:
      - "Aufdeckung: {cards}. Alles {card_pl}; {caller} lag falsch."
      - "{target} war ehrlich ({cards}). {caller} rief falsch."
      - "Falscher Ruf: {target} zeigte {cards}, alles wahr."
      - "Der Zug von {target} war ehrlich: {cards}. {caller} verliert den Ruf."
    devil_revealed:
      - "Aufdeckung: {cards}, darunter die Teufelskarte. Alle außer {target} schießen."
    trigger_click:
      - "{player} drückt ab (Abzug {pull}, Chance {odds}): leer."
