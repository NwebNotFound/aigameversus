# Die Worte der Liar's-Deck-Chronik auf Deutsch: vier Stile mit eigenem Aufbau und eigenen Worten.
# Felder: siehe `FIELDS` in arena/chronicle/tell_liars_deck.py (die Tests formatieren jede Variante).
# `again` steht vor einem Satz, den alle Varianten seiner Art in dieser Chronik schon gebraucht haben.
epic:
  title: "Die Saga von Liar's Deck"
  layout: {joiner: " ", prefix: "", paragraph: 0}
  again: ["Noch einmal:", "Wieder:", "Und erneut:", "Abermals:", "Wie zuvor:", "Ein weiteres Mal:"]
  chapters:
    prologue: "Prolog: Der Tisch ist gedeckt"
    round: "Die Runde der {nth}n Prüfung"
    epilogue: "Epilog: Der Letzte am Tisch"
  glance_title: "Auf einen Blick"
  glance_labels:
    winner: "Letzter Überlebender"
    length: "Dauer"
    turning_point: "Der Wendepunkt"
    bluffer: "Kühnster Bluffer"
    caller: "Schärfster Rufer"
    survivor: "Glücklichste Seele"
    cost: "Preis der Saga"
  glance_values:
    length: "{rounds} Runden"
    bluffer: "{who}, log in {lies} von {plays} Zügen"
    caller: "{who}, richtig bei {right} von {of} Rufen"
    survivor: "{who}, der {shots} Abzüge überlebte"
    cost: "{cost}"
  turning_points:
    coin_flip: "Runde {n}: {player} stand vor einem Münzwurf mit dem Revolver und überlebte"
    devil: "Runde {n}: Die Teufelskarte kam ans Licht, und der ganze Tisch zahlte"
    big_lie_caught: "Runde {n}: {target} wurde mit {count} falschen Karten der Lüge überführt"
    final_duel: "Runde {n}: {winner} überdauerte {loser} im letzten Duell"
    final_shot: "Runde {n}: Der letzte Schuss traf {loser}, und {winner} stand allein"
    wrong_call_fatal: "Runde {n}: {caller} rief gegen die ehrliche Hand von {target} und zahlte mit dem Leben"
  kinds:
    cast:
      - "{count} Spieler setzten sich an den Tisch, jeder mit Revolver und einer Lüge in Reserve: {cast}."
    cast_devil:
      - "{count} Spieler setzten sich, und unter den Karten lag die Teufelskarte: {cast}."
    round_starts:
      - "Die {nth} Runde begann, Tischkarte {card}, noch {alive} saßen am Tisch, und {starter} eröffnete."
      - "Runde {n}: Die Tischkarte war {card}, {alive} Spieler blieben, und {starter} führte an."
      - "Die Karten wurden neu gegeben, {card} war die Tischkarte der {nth}n Runde; {starter} sprach zuerst."
      - "Die {nth} Runde: Tischkarte {card}, {alive} blieben, und {starter} begann zu reden."
      - "Wieder wurden die Karten gemischt, {card} ausgerufen, und {starter} trat vor."
    duel:
      - "Nur {a} und {b} blieben übrig, und der Raum hielt den Atem an."
      - "Es war nun ein Duell, {a} gegen {b}, und niemand sonst, hinter dem man sich verstecken konnte."
      - "Allein am Tisch maßen {a} und {b} einander noch einmal."
    lie_big:
      - "{who} legte {count} Karten verdeckt ab und nannte sie {card_pl}, obwohl {false_cards} davon nichts dergleichen waren."
      - "{who} schob {count} Karten vor und schwor, es seien alles {card_pl}; {false_cards} waren gelogen."
    truth_big:
      - "{who} legte {count} Karten ab, und jede davon war wirklich {card}."
      - "{who} spielte {count} {card_pl} und sagte die Wahrheit, der kühnste Bluff von allen."
    claim_quote:
      - "{who} sagte: \"{quote}\""
      - "\"{quote_bare}\", sagte {who}."
      - "{who} sprach, ruhig wie ein See: \"{quote}\""
      - "{who} bot dem Tisch an: \"{quote}\""
    call:
      - "{caller} erhob sich und nannte {target} einen Lügner!"
      - "\"Lügner!\", rief {caller} und zeigte auf {target}."
      - "{caller} glaubte {target} nicht und sagte es."
      - "{caller} kniff die Augen zusammen und sah {target} an: Lügner."
    call_auto:
      - "{caller} blieb nichts anderes übrig, als {target} einen Lügner zu nennen."
    reveal_caught:
      - "Die Karten wurden umgedreht: {cards}. Keine {card_pl} darunter, {n_false} davon gelogen. {target} war erwischt."
      - "Die Hand von {target} lag offen: {cards}. Die Behauptung von {card_pl} brach zusammen, und {caller} hatte recht gehabt."
    reveal_wrong:
      - "Die Karten wurden umgedreht: {cards}. Alles wahr, alles {card_pl}. {caller} hatte eine ehrliche Hand angeklagt."
      - "{target} zeigte {cards}, und alles war ehrlich. {caller} hatte falsch gerufen."
      - "Die Wahrheit lag auf dem Tisch: {cards}. {caller} hatte den Falschen angezweifelt."
      - "Die Karten von {target} sagten {cards}: ehrlich bis zuletzt. {caller} hatte sich verschätzt."
    devil_revealed:
      - "Die Karten wurden umgedreht: {cards}, und darunter die Teufelskarte! Der Tisch würde für den Ruf von {caller} zahlen."
    trigger_click:
      - "{player} drückte ab, Abzug {pull}, Chance {odds}. Klick. Die Kammer war leer."
      - "{player} setzte den Lauf an die Schläfe, Abzug {pull}, und hörte nur ein Klicken."
      - "Abzug {pull} für {player}, bei {odds}, und nur Stille antwortete."
    trigger_close:
      - "{player} drückte ab, Abzug {pull}, Chance {odds}, und die Kammer war leer. Knapp entkommen."
      - "Eine Chance von {odds} auf den Tod, und {player} lebte: Abzug {pull}, und die Trommel drehte sich weiter."
    trigger_bang:
      - "{player} drückte ab, und der Donnerschlag sagte alles. {player} war fort."
      - "Abzug {pull} war der scharfe für {player}, und der Tisch verstummte."
    eliminated:
      - "{player} verließ den Tisch auf {place}."
      - "So belegte {player} {place}, und der Stuhl blieb leer."
    result:
      - "{winner} blieb nach {rounds} Runden allein übrig, der Letzte, der noch atmete."
    ranking:
      - "Die Endreihenfolge: {ranking}."
