      - "{player} überlebt Abzug {pull} ({odds})."
    trigger_close:
      - "{player} drückt ab (Abzug {pull}, Chance {odds}): leer, knapp."
      - "Knapp: {player} überlebt Abzug {pull} bei {odds}."
    trigger_bang:
      - "{player} drückt ab (Abzug {pull}): SCHARF. {player} ist raus."
      - "KNALL: {player} scheidet bei Abzug {pull} aus."
    eliminated:
      - "{player} belegt {place}."
      - "Raus: {player}, {place}."
    result:
      - "{winner} gewinnt nach {rounds} Runden."
    ranking:
      - "Endreihenfolge: {ranking}."
