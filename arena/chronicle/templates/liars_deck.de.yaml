    lie_big:
      - "{who} spielt {count} Karten als {card_pl}; {false_cards} sind falsch."
      - "{who} blufft mit {count} Karten ({false_cards} falsch)."
    truth_big:
      - "{who} spielt {count} Karten, alles echte {card_pl}."
      - "{who} sagt die Wahrheit: {count} {card_pl}."
