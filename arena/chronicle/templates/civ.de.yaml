# Die Worte der Chronik von Throne of Tokens auf Deutsch: vier Stile, die sich in Aufbau und
# Wortwahl unterscheiden. Felder: siehe `FIELDS` in arena/chronicle/tell_civ.py (die Tests
# formatieren jede Variante). Eine Nation steht nur im Nominativ oder Akkusativ (nach "gegen",
# "an", "für"), denn die neutrale Seite heißt "die Barbarenhorde" und ändert sonst ihren Artikel.
# `again` steht vor einem Satz, den jede Variante seiner Art in dieser Chronik schon erzählt hat.
epic:
  title: "Die Sage vom Thron der Token"
  layout: {joiner: " ", prefix: "", paragraph: 0}
  again: ["Und abermals:", "Wieder:", "Und noch einmal:", "Erneut:", "Wie zuvor:", "Ein weiteres Mal:"]
  chapters:
    prologue: "Prolog: Die Völker erwachen"
    age: "Das {Nth} Zeitalter"
    epilogue: "Epilog: Wer den Thron hielt"
  glance_title: "Auf einen Blick"
  glance_labels:
    winner: "Wer den Thron hielt"
    length: "Dauer"
    turning_point: "Die Wende"
    conqueror: "Größter Eroberer"
    diplomat: "Eifrigster Diplomat"
    cost: "Kosten der Sage"
  glance_values:
    winner:
      domination: "{winners}, durch Eroberung"
      economy: "{winners}, durch einen Schatz, der nicht versiegte"
      round_limit: "{winners}, am stärksten, als die Zeit ablief"
    length: "{rounds} Runden"
    conqueror: "{who}, eroberte {cities}"
    diplomat: "{who}, schloss {treaties}"
    cost: "{cost}"
  turning_points:
    capital: "Zeitalter {n}: {taker} nahm die Hauptstadt, die {loser} gehörte"
    battle: "Zeitalter {n}: {attacker} griff {defender} an, und {lost} Einheiten fielen"
    war: "Zeitalter {n}: {by} erklärte den Krieg gegen {on}"
  kinds:
    cast:
      - "{count} Völker erhoben sich aus dem Nebel, jedes aus einer einzigen Hauptstadt, und {rounds} Runden blieben, um den Thron zu erringen: {cast}."
      - "{count} Reiche erwachten in einer Welt von {rounds} Runden und einem Thron: {cast}."
    age_starts:
      - "Das {nth} Zeitalter brach an, die Runden {first} bis {last}."
      - "So begann das {nth} Zeitalter, von Runde {first} bis Runde {last}."
      - "Runden {first} bis {last}: das {nth} Zeitalter der Welt."
      - "Ein neues Zeitalter kam, das {nth}, und es umspannte die Runden {first} bis {last}."
    founded_one:
      - "{who} gründete eine neue Stadt in der Wildnis."
      - "Die Siedler, die {who} aussandte, schlugen ihre Pflöcke ein, und eine Stadt entstand."
      - "{who} gründete eine Stadt, und ein Banner wehte über frischen Feldern."
    founded_many:
      - "{who} breitete sich über das Land aus und gründete {count} Städte."
      - "{count} neue Städte trugen nun das Banner, das {who} gehörte."
      - "{who} zog weit hinaus, und {count} Städte entstanden."
    conquest:
      - "{taker} erstürmte eine Stadt und entriss sie {loser}."
      - "{loser} verlor eine Stadt an {taker}."
      - "{taker} brach die Mauern einer Stadt, die {loser} gehörte, und nahm sie ein."
    conquest_capital:
      - "Die Hauptstadt, die {loser} gehörte, fiel an {taker}, und das Reich erbebte."
      - "{taker} zog in die Hauptstadt ein, die {loser} gehörte."
    battle_attacker_won:
      - "{attacker} fiel über {defender} her und behielt das Feld; {attacker} verlor {lost_attacker}, {defender} {lost_defender}."
      - "In einer großen Schlacht schlug {attacker} {defender}, um den Preis von {lost_attacker} gegen {lost_defender}."
      - "{attacker} griff {defender} an und siegte; {attacker} verlor {lost_attacker}, {defender} {lost_defender}."
    battle_defender_won:
      - "{attacker} griff {defender} an und wurde zurückgeschlagen; {attacker} verlor {lost_attacker}, {defender} {lost_defender}."
      - "{defender} hielt stand, als {attacker} angriff; die Angreifer verloren {lost_attacker}, {defender} {lost_defender}."
      - "Der Sturm, den {attacker} führte, brach sich an {defender}; {lost_attacker} verloren gegen {lost_defender}."
    battle_city_held:
      - "{attacker} belagerte eine Stadt, die {defender} gehörte, doch ihre Mauern hielten; {attacker} verlor {lost_attacker}, {defender} {lost_defender}."
      - "Eine Stadt, die {defender} gehörte, trotzte dem Sturm; {attacker} verlor {lost_attacker}, die Verteidiger {lost_defender}."
    war:
      - "{by} erklärte den Krieg gegen {on}, und die Kriegstrommeln begannen zu schlagen."
      - "{by} warf jeden Frieden fort und zog gegen {on}."
      - "Krieg! {by} richtete die Speere gegen {on}."
    war_joined:
      - "{by} erklärte den Krieg gegen {on}, und {joined} griffen zu den Waffen gegen {by}."
      - "{by} zog gegen {on}, und die Verbündeten {joined} folgten dem Ruf."
    peace:
      - "{a} und {b} legten die Waffen nieder und schlossen Frieden."
      - "Frieden wurde geschworen: {a} und {b} kämpften nicht länger."
      - "{a} und {b} beendeten ihren Streit mit einem Frieden."
    treaty:
      - "{a} und {b} besiegelten einen Pakt: {treaty}."
      - "{a} und {b} setzten ihre Siegel unter einen Vertrag: {treaty}."
      - "Gesandte ritten hin und her, und {a} und {b} unterzeichneten einen Vertrag: {treaty}."
    broken:
      - "{by} brach das Wort, das es {other} gegeben hatte, und der Vertrag zerriss."
      - "{by} warf den Vertrag fort und ließ {other} allein."
    event_plague:
      - "Die Pest kroch in eine Stadt, die {who} gehörte, und die Gassen verstummten."
      - "Eine Seuche fegte durch eine Stadt, die {who} gehörte."
    event_drought:
      - "Dürre verbrannte die Felder, und {who} sah die Kornspeicher leer werden."
      - "Der Regen blieb aus, und {who} litt Hunger."
    event_rebellion:
      - "Eine Stadt, die {who} gehörte, erhob sich und warf ihre Herren ab."
      - "Rebellen ergriffen eine Stadt und sagten sich los; {who} hatte sie verloren."
    event_barbarians:
      - "Aus der Wildnis kam eine Barbarenhorde."
      - "In der Wildnis sammelten sich Barbaren, gierig nach Beute."
    gold_rush:
      - "{who} begann Gold zu horten, und der Wettlauf um den Schatz begann: {needed} Runden lang musste es halten."
      - "Die Kammern füllten sich, und hielt {who} sie {needed} Runden lang, wäre der Thron gewonnen."
    talk:
      - "{who} sprach vor allen Völkern: \"{quote}\""
      - "\"{quote}\", verkündete {who}."
      - "{who} sandte Kunde an jeden Hof: \"{quote}\""
    result_domination:
      - "In Runde {round} hielt {winners} die halbe Welt, und der Thron war durch Eroberung gewonnen."
    result_economy:
      - "In Runde {round} überdauerte das Gold jeden Rivalen: {winners} hatte den Thron gekauft, nicht erkämpft."
    result_round_limit:
      - "Runde {round} kam, die letzte der Welt, und {winners} stand am stärksten da."
    ranking:
      - "Die letzte Abrechnung, nach Punkten: {ranking}."
