    battle_city_held:
      - "{attacker} warf sich gegen eine Stadt, die {defender} gehörte, und die Mauern rührten sich nicht; {lost_attacker} verloren, {lost_defender} drinnen."
      - "Eine Stadt, die {defender} gehörte, hielt gegen {attacker}; die Angreifer verloren {lost_attacker}, die Stadt {lost_defender}."
    war:
      - "{by} entschied, dass es Zeit war, und erklärte den Krieg gegen {on}."
      - "Am Ende wählte {by} den Krieg, und das Ziel hieß {on}."
      - "{by} wandte sich gegen {on}, und die Ruhe war vorbei."
    war_joined:
      - "{by} erklärte den Krieg gegen {on}, und {joined} hielten sich nicht heraus: Sie kämpften für {on}."
      - "Als {by} gegen {on} in den Krieg zog, stellten sich {joined} gegen {by}."
    peace:
      - "{a} und {b} waren es leid und schlossen Frieden."
      - "Endlich kamen {a} und {b} überein aufzuhören."
      - "{a} und {b} legten die Waffen nieder, fürs Erste."
    treaty:
      - "{a} und {b} fanden etwas, worauf sie sich einigen konnten: {treaty}."
      - "{a} und {b} unterschrieben einen Vertrag, {treaty}, und beide hofften, er würde halten."
      - "Nun gab es einen Vertrag, {a} und {b} hatten ihn unterschrieben: {treaty}."
    broken:
      - "{by} brach das Wort, das {other} gegolten hatte, und niemand vergaß es."
      - "Der Vertrag hielt nicht; {by} zerriss ihn, und {other} blieb allein zurück."
    event_plague:
      - "Dann kam die Pest in eine Stadt, die {who} gehörte, und die Menschen blieben hinter ihren Türen."
      - "Eine Krankheit breitete sich in einer Stadt aus, die {who} gehörte."
    event_drought:
      - "Der Regen blieb aus, und {who} sah die Felder braun werden."
      - "Dürre legte sich über das Land; {who} litt darunter."
    event_rebellion:
      - "Eine Stadt, die {who} gehörte, hatte genug und erhob sich."
      - "Rebellen nahmen eine Stadt, und {who} hatte sie verloren; nun gehorchte sie niemandem."
    event_barbarians:
      - "Draußen in der Wildnis sammelte sich eine Barbarenbande."
      - "Barbaren kamen aus dem Nichts, wie sie es immer tun."
    gold_rush:
      - "{who} begann Gold zu sparen, und alle wussten, was {needed} Runden davon bedeuten würden."
      - "Die Schatzkammer füllte sich; noch {needed} Runden, und {who} hätte genug."
    talk:
      - "{who} sagte, für alle, die zuhörten: \"{quote}\""
      - "\"{quote}\", sagte {who}."
      - "{who} sagte es geradeheraus: \"{quote}\""
    result_domination:
      - "In Runde {round} war es vorbei: {winners} hielt so viel von der Welt, dass niemand widersprechen konnte."
    result_economy:
      - "In Runde {round} entschied das Gold, leise; es gehörte {winners}."
    result_round_limit:
      - "Runde {round} war die letzte, und als sie endete, lag {winners} vorn."
    ranking:
      - "Am Ende sah es so aus, nach Punkten: {ranking}."
